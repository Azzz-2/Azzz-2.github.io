<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="灯光师与 VJ 个人主页入口" />
    <meta name="theme-color" content="#070707" />
    <title>AZZZ｜个人主页</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #070707;
        color: #f4f0e9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 92, 55, 0.2), transparent 32rem),
          radial-gradient(circle at 82% 78%, rgba(58, 102, 255, 0.2), transparent 34rem),
          #070707;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        padding: 56px 0;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #a7a7a7;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(42px, 9vw, 104px);
        line-height: 0.92;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 620px;
        margin: 24px 0 42px;
        color: #bdbdbd;
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.7;
      }

      .profiles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .profile {
        min-height: 280px;
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: inherit;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .profile:hover,
      .profile:focus-visible {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.55);
        outline: none;
      }

      .profile-light { background: linear-gradient(145deg, rgba(255, 79, 43, 0.2), rgba(255, 255, 255, 0.03)); }
      .profile-visual { background: linear-gradient(145deg, rgba(63, 89, 255, 0.22), rgba(255, 255, 255, 0.03)); }

      .tag {
        color: #b7b7b7;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      h2 {
        margin: 0 0 10px;
        font-size: clamp(32px, 5vw, 58px);
        letter-spacing: -0.04em;
      }

      .profile p { margin: 0; color: #bebebe; line-height: 1.65; }
      .enter { margin-top: 28px; font-weight: 700; }

      @media (max-width: 700px) {
        main { padding: 36px 0; }
        .profiles { grid-template-columns: 1fr; }
        .profile { min-height: 230px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AZZZ · PORTFOLIO DIRECTORY</p>
      <h1>选择要访问的个人主页</h1>
      <p class="intro">灯光与视觉拥有各自独立的个人信息、经历和作品内容。</p>

      <section class="profiles" aria-label="个人主页入口">
        <a class="profile profile-light" href="./light/">
          <span class="tag">LIGHTING PROFILE</span>
          <div>
            <h2>灯光主页</h2>
            <p>灯光师个人简介、从业经历与现场作品。</p>
            <div class="enter">进入主页 →</div>
          </div>
        </a>

        <a class="profile profile-visual" href="./visual/">
          <span class="tag">VJ / VISUAL PROFILE</span>
          <div>
            <h2>VJ 主页</h2>
            <p>VJ 个人简介、技能方向与现场视觉作品。</p>
            <div class="enter">进入主页 →</div>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
