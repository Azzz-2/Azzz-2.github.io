<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VJ 小志</title>
<meta name="description" content="VJ 小志的个人网站：十几万颗光粒子组成的他本人，点进每一页，粒子都会重组成那一页的内容。现场 MOTION / DOWN TOWN，AI 影像《夜的谱系》。">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="VJ 小志">
<meta property="og:description" content="VJ 小志的个人网站：十几万颗光粒子组成的他本人，点进每一页，粒子都会重组成那一页的内容。现场 MOTION / DOWN TOWN，AI 影像《夜的谱系》。">
<meta property="og:image" content="assets/img/home-fallback.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23FFCF96' opacity='.3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FFE7C4'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"XZ Sans";src:url(assets/fonts/xz-sans-300.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"XZ Sans";src:url(assets/fonts/xz-sans-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"XZ Sans";src:url(assets/fonts/xz-sans-900.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Martian Mono";src:url(assets/fonts/martian-mono-var.woff2) format("woff2");font-weight:100 800;font-style:normal;font-stretch:75% 112.5%;font-display:swap}
/* 黑暗里只有一片光粒子（canvas），文字只做标注。所有颜色走下面的 token。 */
:root {
  --bg: #050505;
  --ink: #EEE9E2;
  --mid: #A9A39B;
  --dim: #6F6B72;
  --warm: #FFCF96;
  --line: rgba(238, 233, 226, .13);
  --f-sans: "XZ Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .1, 1);
  --pad: clamp(20px, 4.2vw, 80px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-sans);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 1px solid var(--warm); outline-offset: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-stretch: 87.5%; letter-spacing: .16em; text-transform: uppercase; }

/* ------------------------------------------------------------------ 画布 / 降级图 */
.gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 1.4s var(--ease); }
body.gl-on .gl { opacity: 1; }
.fallback { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 66% 50%; display: none; }
body.no-gl .fallback { display: block; }
body.no-gl .gl { display: none; }

/* ------------------------------------------------------------------ 页眉 */
.top {
  position: fixed; z-index: 20; left: var(--pad); right: var(--pad); top: calc(var(--pad) * .62 + var(--safe-t));
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  opacity: 0; transition: opacity 1.2s var(--ease);
}
body.ready .top { opacity: 1; }
.top > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: 14px; height: 44px; font-size: 15px; font-weight: 500; letter-spacing: .32em; }
.logo i { width: 6px; height: 6px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 10px var(--warm); }
.logo .back { font-style: normal; font-size: 10px; color: var(--dim); opacity: 0; transform: translateX(-8px); transition: opacity .4s var(--ease), transform .4s var(--ease); }
body.in-section .logo .back { opacity: 1; transform: none; }
.logo:hover .back { color: var(--ink); }
.sound { display: flex; align-items: center; gap: 12px; height: 44px; font-size: 10px; color: var(--dim); transition: color .3s; }
.sound:hover, .sound[aria-pressed="true"] { color: var(--ink); }
.sound .bars { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
.sound .bars b { width: 2px; height: 3px; background: currentColor; transition: height .12s linear; }

/* ------------------------------------------------------------------ 首页标注 */
.home { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease); }
body.ready[data-view="home"] .home { opacity: 1; transition: opacity 1.2s var(--ease) .5s; }
.who { position: absolute; left: var(--pad); bottom: calc(var(--pad) * .9 + var(--safe-b)); }
.who h1 { margin: 0; font-size: clamp(54px, 4.8vw, 92px); font-weight: 300; letter-spacing: .06em; line-height: 1; }
.who h1 small { position: relative; top: .5em; margin-left: 14px; vertical-align: top; font-family: var(--f-mono); font-size: 15px; font-weight: 400; letter-spacing: .3em; color: var(--mid); }
.who p { margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 10.5px; color: var(--dim); }
.who p b { color: var(--mid); font-weight: 400; }
.hint { position: absolute; right: var(--pad); bottom: calc(var(--pad) * .9 + var(--safe-b) + 6px); margin: 0; display: flex; align-items: center; gap: 12px; font-size: 10px; color: var(--dim); }
.hint i { position: relative; width: 16px; height: 16px; border: 1px solid var(--dim); border-radius: 50%; }
.hint i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 2px; height: 2px; border-radius: 50%; background: var(--mid); }

/* ------------------------------------------------------------------ 入口：贴在彗星头上 */
.entries { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .4s var(--ease); }
body.ready[data-view="home"] .entries { opacity: 1; transition: opacity 1.2s var(--ease) .9s; }
body:not([data-view="home"]) .entries { visibility: hidden; transition: opacity .4s var(--ease), visibility 0s .4s; }
.entry { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: auto; will-change: transform; transition: opacity .4s; }
.entry .dot { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; border-radius: 50%; }
.entry .l { position: absolute; top: 0; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; transform: translateY(-50%); }
.entry.right .l { left: 24px; }
.entry.left .l { right: 24px; flex-direction: row-reverse; }
.entry em { font-style: normal; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--dim); transition: color .3s; }
.entry b { font-size: 17px; font-weight: 500; letter-spacing: .26em; color: var(--mid); transition: color .3s; }
.entry .sub { position: absolute; top: 18px; white-space: nowrap; font-size: 10px; letter-spacing: .14em; color: var(--warm); opacity: 0; transition: opacity .3s; }
.entry.right .sub { left: 24px; }
.entry.left .sub { right: 24px; }
.entry.on b, .entry:focus-visible b { color: #fff; }
.entry.on em, .entry:focus-visible em { color: var(--warm); }
.entry.on .sub, .entry:focus-visible .sub { opacity: .9; }
.entry.behind { opacity: .58; }
.entry:focus-visible { outline: none; }
.entry:focus-visible .dot { outline: 2px solid var(--warm); outline-offset: 2px; }
.entry:active .dot { box-shadow: inset 0 0 0 2px var(--warm); }

/* ------------------------------------------------------------------ 四页 */
.panel { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .35s var(--ease), visibility 0s linear .35s; }
.panel.is-on { opacity: 1; visibility: visible; transition: opacity .8s var(--ease) var(--in, .9s), visibility 0s; }
.panel button { pointer-events: auto; }
.fb-big, .nm { display: none; }
.line { position: absolute; margin: 0; white-space: nowrap; font-size: 13px; font-weight: 300; letter-spacing: .32em; color: var(--mid); }

.cap { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.cap b { display: block; margin-right: -.3em; font-size: 20px; font-weight: 300; letter-spacing: .3em; }
.cap span { display: block; margin-top: 10px; font-size: 10px; color: var(--dim); }

.row { position: absolute; display: block; pointer-events: auto; }
.row .zh { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 15px; letter-spacing: .24em; color: var(--mid); transition: color .3s; }
.row .zh small { display: block; margin-top: 8px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--dim); }
.row:hover .zh, .row.on .zh, .row:focus-visible .zh { color: #fff; }
.row:focus-visible { outline: none; }

.wall-box { position: absolute; overflow: hidden; }
.wall-video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
body.plain-video .wall-video { opacity: 1; }
.works-side { position: absolute; width: min(360px, 26vw); }
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist button {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 6px 12px; width: 100%;
  padding: 15px 0 14px; border-top: 1px solid var(--line); text-align: left; color: var(--mid); transition: color .3s;
}
.wlist li:last-child button { border-bottom: 1px solid var(--line); }
.wlist .n { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--dim); }
.wlist .t { font-size: 17px; letter-spacing: .14em; }
.wlist .len { font-family: var(--f-mono); font-size: 10px; color: var(--dim); }
.wlist .s { grid-column: 2 / 4; font-size: 11px; letter-spacing: .16em; color: var(--dim); }
.wlist button:hover, .wlist button[aria-current="true"] { color: #fff; }
.wlist button[aria-current="true"] .n { color: var(--warm); }
.watch {
  margin-top: 28px; display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 24px 0 20px; border-radius: 999px;
  box-shadow: inset 0 0 0 1px rgba(255, 207, 150, .5); color: var(--warm); font-size: 13px; letter-spacing: .3em; transition: background .3s;
}
.watch svg { width: 13px; height: 13px; fill: currentColor; }
.watch:hover { background: rgba(255, 207, 150, .08); }
.film-info { position: absolute; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.film-t { min-width: 0; }
.film-t h2 { margin: 0; font-size: clamp(30px, 3vw, 50px); font-weight: 300; letter-spacing: .24em; line-height: 1.1; }
.film-t p { margin: 16px 0 0; font-size: 10.5px; color: var(--dim); }
.film-info .watch { margin-top: 0; flex: none; }
.preview-note { color: var(--dim); font-size: 11px; letter-spacing: .1em; margin-left: 12px; }

.clist { position: absolute; list-style: none; margin: 0; padding: 0; width: min(440px, 34vw); pointer-events: auto; }
.clist li { display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 12px; padding: 18px 0; border-top: 1px solid var(--line); }
.clist li:last-child { border-bottom: 1px solid var(--line); }
.clist .k { font-size: 14px; letter-spacing: .3em; color: var(--mid); }
.clist .k small { display: block; margin-top: 6px; font-family: var(--f-mono); font-size: 9px; letter-spacing: .16em; color: var(--dim); }
.clist .v { font-size: 14px; letter-spacing: .06em; overflow-wrap: anywhere; }
.clist .v.empty { color: var(--dim); letter-spacing: .2em; }
.clist a.v { color: inherit; text-decoration: none; }
.clist a.v:hover { color: #fff; }
.clist .copy { height: 32px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--mid); }
.clist .copy:hover:not(:disabled) { color: #fff; box-shadow: inset 0 0 0 1px var(--mid); }
.clist .copy:disabled { opacity: .3; }

/* 页间导航 */
.secnav {
  position: fixed; z-index: 8; left: 50%; bottom: calc(var(--pad) * .55 + var(--safe-b)); transform: translateX(-50%);
  display: flex; gap: 4px; opacity: 0; visibility: hidden; transition: opacity .35s var(--ease), visibility 0s .35s;
}
body.in-section .secnav { opacity: 1; visibility: visible; transition: opacity .8s var(--ease) 1.1s, visibility 0s; }
.secnav button { display: flex; align-items: baseline; gap: 8px; height: 44px; padding: 0 14px; font-size: 9.5px; color: var(--dim); transition: color .3s; }
.secnav button b { font-family: var(--f-sans); font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: none; }
.secnav button:hover, .secnav button[aria-current="true"] { color: var(--ink); }
.secnav button[aria-current="true"] { color: #fff; }
.secnav button[aria-current="true"] span { color: var(--warm); }

.toast {
  position: fixed; z-index: 70; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translate(-50%, 10px); padding: 10px 16px; border-radius: 999px;
  background: #17171B; font-size: 12px; letter-spacing: .12em; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s var(--ease);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------------------------------------------ 竖屏（手机） */
html.portrait .who { bottom: calc(32px + var(--safe-b)); }
html.portrait .who h1 { font-size: 54px; }
html.portrait .who p { margin-top: 18px; }
html.portrait .hint { display: none; }
html.portrait .entry { left: -32px; top: -32px; width: 64px; height: 64px; opacity: 1; touch-action: manipulation; }
html.portrait .entry .dot { left: 0; top: 0; width: 64px; height: 64px; }
html.portrait .entry .sub, html.portrait .entry em { display: none; }
html.portrait .entry .l { top: 32px; }
html.portrait .entry.right .l { left: 64px; }
html.portrait .entry.left .l { right: 64px; }
html.portrait .entry b { font-size: 15px; letter-spacing: .16em; color: var(--ink); }
html.portrait .film-info { flex-direction: column; align-items: flex-start; gap: 22px; }
html.portrait .works-side { width: auto; }
html.portrait .clist { width: auto; }
html.portrait .secnav { left: var(--pad); right: var(--pad); transform: none; justify-content: space-between; gap: 0; }
html.portrait .secnav button { padding: 0 6px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 52px; }
html.portrait .line { white-space: normal; text-align: center; }

/* ------------------------------------------------------------------ 没有 WebGL2：静态人像 + 文字版 */
body.no-gl .entries { inset: auto var(--pad) auto auto; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; opacity: 1; }
body.no-gl .entry { position: relative; left: auto; top: auto; width: auto; height: 48px; transform: none !important; }
body.no-gl .entry .dot { display: none; }
body.no-gl .entry .l { position: static; transform: none; }
body.no-gl .entry:focus-visible { outline: 2px solid var(--warm); outline-offset: 4px; }
body.no-gl .panel { background: rgba(5, 5, 5, .86); }
body.no-gl .fb-big { display: block; position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: min(22vw, 30vh); font-weight: 900; line-height: 1; color: var(--ink); }
body.no-gl.plain-video .wall-video { opacity: 1; }
body.no-gl .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 110px var(--pad) 120px; }
body.no-gl .panel .caps, body.no-gl .panel .rows { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 56px; }
body.no-gl .cap, body.no-gl .row, body.no-gl .line, body.no-gl .wall-box, body.no-gl .works-side, body.no-gl .clist { position: static !important; transform: none !important; width: auto !important; height: auto !important; }
body.no-gl .row .zh { position: static; transform: none; }
body.no-gl .nm { display: block; font-family: var(--f-mono); font-weight: 800; font-style: normal; font-size: clamp(28px, 6vw, 72px); line-height: 1.1; color: var(--ink); }
body.no-gl .cap .nm { font-size: clamp(64px, 14vw, 180px); }
body.no-gl .wall-box { width: min(90vw, 720px) !important; aspect-ratio: 16 / 9; }
body.no-gl .film-info { position: static !important; transform: none !important; width: min(90vw, 720px) !important; }
body.no-gl #p-about .fb-big { display: none; }

/* ------------------------------------------------------------------ 播放器 */
.theater { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-rows: auto 1fr auto; background: #020203; opacity: 0; transition: opacity .45s var(--ease); }
.theater.is-open { opacity: 1; }
.th-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(16px + var(--safe-t)) 24px 12px; }
.th-title { min-width: 0; margin: 0; font-size: 15px; letter-spacing: .12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th-close { flex: none; display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px #2A2930; color: var(--mid); font: 11px/1 var(--f-mono); letter-spacing: .1em; white-space: nowrap; }
.th-close:hover { color: var(--ink); }
.th-close kbd { font: inherit; padding: 2px 5px; border-radius: 3px; background: #24232A; }
.th-stage { position: relative; min-height: 0; margin: 0 24px; }
.th-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; }
.th-video.is-active { opacity: 1; }
.th-bar { display: flex; align-items: center; gap: 16px; padding: 14px 24px calc(18px + var(--safe-b)); }
.th-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none; color: var(--ink); }
.th-btn:hover { background: rgba(255, 255, 255, .07); }
.th-btn svg { width: 20px; height: 20px; fill: currentColor; }
.th-btn .i-play, .theater.is-paused .th-btn .i-pause { display: none; }
.theater.is-paused .th-btn .i-play { display: block; }
.th-btn .i-x, .theater.is-muted .i-wave { display: none; }
.theater.is-muted .i-x { display: block; }
.th-time { flex: none; min-width: 11ch; font: 11px/1 var(--f-mono); color: var(--mid); font-variant-numeric: tabular-nums; }
.th-progress { position: relative; flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; cursor: pointer; }
.th-track { position: relative; width: 100%; height: 2px; background: rgba(255, 255, 255, .16); }
.th-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--warm); box-shadow: 0 0 10px var(--warm); }
.th-ticks { position: absolute; inset: 0; pointer-events: none; }
.th-tip { position: absolute; bottom: 30px; transform: translateX(-50%); padding: 5px 9px; border-radius: 3px; background: #17171B; font: 11px/1 var(--f-mono); white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
.th-progress:hover .th-tip { opacity: 1; }
.th-chapter { display: none; }
@media (max-width: 640px) {
  .th-bar { flex-wrap: wrap; gap: 6px 12px; }
  .th-progress { order: -1; flex: 1 0 100%; }
  .th-time { margin-right: auto; }
}
@media (hover: none) { .th-close kbd { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .gl, .top, .home, .entries, .panel, .panel.is-on, .secnav { transition-duration: .3s !important; transition-delay: 0s !important; }
}

</style>
</head>
<body>
<canvas class="gl" id="gl" aria-hidden="true"></canvas>
<img class="fallback" id="fallback" src="assets/img/home-fallback.jpg" alt="" aria-hidden="true">

<header class="top">
  <button class="logo" id="logo" type="button" aria-label="回到首页"><i aria-hidden="true"></i><span>小志</span><em class="back mono" aria-hidden="true">返回</em></button>
  <button class="sound mono" id="sound" type="button" aria-pressed="false" aria-label="现场声音"><span class="bars" aria-hidden="true"><b></b><b></b><b></b><b></b></span><span id="sound-label">Sound off</span></button>
</header>

<section class="home" id="home" aria-label="首页">
  <div class="who">
    <h1>小志<small>VJ</small></h1>
    <p class="mono"><span><b>21</b> yrs</span><span><b>3</b> years on stage</span><span>all genres</span></p>
  </div>
  <p class="hint mono" id="hint"><i aria-hidden="true"></i><span>移动鼠标 · 拨动光粒子</span></p>
</section>

<nav class="entries" id="entries" aria-label="入口"></nav>

<section class="panel" id="p-about" data-view="about" aria-label="关于">
  <div class="fb-big" aria-hidden="true"></div>
  <div class="caps" id="about-caps"></div>
  <p class="line" id="about-line"></p>
</section>

<section class="panel" id="p-skills" data-view="skills" aria-label="技能">
  <div class="rows" id="skill-rows"></div>
  <p class="line" id="skills-line"></p>
</section>

<section class="panel" id="p-live" data-view="live" aria-label="现场">
  <div class="wall-box" id="live-box"><video class="wall-video" id="wall-video" muted playsinline loop preload="auto" aria-hidden="true"></video></div>
  <div class="works-side" id="live-side">
    <ol class="wlist" id="llist"></ol>
    <button class="watch" id="watch-live" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><span>观看完整版</span></button>
  </div>

/* WebGL2 工具：着色器、帧缓冲；光晕后期（HDR 累加 → 逐级降采样模糊 → 色调映射 + 暗角 + 颗粒） */
(function () {
  const XZ = window.XZ;

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s); gl.deleteShader(s);
      throw new Error('shader compile: ' + log);
    }
    return s;
  }

  function program(gl, vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('program link: ' + gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
    }
    return { p, u };
  }

  function target(gl, w, h, hdr) {
    w = Math.max(1, w | 0); h = Math.max(1, h | 0);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) { gl.deleteFramebuffer(fb); gl.deleteTexture(tex); return null; }
    return { fb, tex, w, h };
  }

  function drop(gl, t) { if (t) { gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex); } }

  const QUAD_VS = `#version 300 es
layout(location = 0) in vec2 aP;
out vec2 vUv;
void main() { vUv = aP * .5 + .5; gl_Position = vec4(aP, 0., 1.); }`;

  // 4 点双线性降采样；uThr > 0 时只留亮部
  const DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThr; out vec4 o;
void main() {
  vec3 c = texture(uTex, vUv + uTexel * vec2(-.5, -.5)).rgb + texture(uTex, vUv + uTexel * vec2(.5, -.5)).rgb
         + texture(uTex, vUv + uTexel * vec2(-.5, .5)).rgb + texture(uTex, vUv + uTexel * vec2(.5, .5)).rgb;
  c *= .25;
  if (uThr > 0.) { float l = max(c.r, max(c.g, c.b)); c *= max(l - uThr, 0.) / max(l, 1e-4); }
  o = vec4(c, 1.);
}`;

  // 9 点高斯（线性采样合并成 5 次取样）
  const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir; out vec4 o;
void main() {
  vec3 c = texture(uTex, vUv).rgb * .2270270;
  c += (texture(uTex, vUv + uDir * 1.3846154).rgb + texture(uTex, vUv - uDir * 1.3846154).rgb) * .3162162;
  c += (texture(uTex, vUv + uDir * 3.2307692).rgb + texture(uTex, vUv - uDir * 3.2307692).rgb) * .0702703;
  o = vec4(c, 1.);
}`;

  const COMP_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uScene, uB1, uB2, uB3;
uniform float uExp, uK1, uK2, uK3, uTime, uFade, uGlow;
uniform vec2 uRes, uGlowPos, uGlowR;
uniform vec3 uBg, uGlowCol;
out vec4 o;

  vec3 s = texture(uScene, vUv).rgb;
  vec3 b = texture(uB1, vUv).rgb * uK1 + texture(uB2, vUv).rgb * uK2 + texture(uB3, vUv).rgb * uK3;
  vec3 c = 1. - exp(-(s + b) * uExp);
  vec2 px = vUv * uRes;
  vec2 g = (px - uGlowPos) / uGlowR;
  c += uBg + uGlowCol * exp(-dot(g, g)) * uGlow;

  o = vec4(pow(max(c, 0.), vec3(1. / 1.04)) * uFade, 1.);

    gl.bindVertexArray(this.quad);
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    gl.bindVertexArray(null);
    this.t = {};

  }

  GL.prototype.program = function (vs, fs) { return program(this.gl, vs, fs); };

  GL.prototype.resize = function (w, h) {
    const gl = this.gl;
    if (w === this.w && h === this.h) return;
    this.w = w; this.h = h;

    Object.values(this.t).forEach((t) => drop(gl, t));
    const mk = (k, s) => { this.t[k] = target(gl, w / s, h / s, this.hdr); };
    mk('scene', 1);
    if (!this.t.scene && this.hdr) { this.hdr = false; mk('scene', 1); }
    mk('h2', 2); mk('q4a', 4); mk('q4b', 4); mk('e8a', 8); mk('e8b', 8); mk('s16a', 16); mk('s16b', 16);

  };

  GL.prototype.begin = function () {
    const gl = this.gl, t = this.t.scene;
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);

    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);

    off += uImp[k].zw * exp(-dot(dd, dd) / uImpR2) * w;

  off += dm * inversesqrt(r2 + 1.) * uPtrPush * exp(-r2 / uPtrR2) * uPtr.z;

  gl_Position = clip;

  float k = 1.;
  if (ps < 1.) { k = ps * ps; ps = 1.; }

  const FS = `#version 300 es
precision mediump float;
in vec3 vC;
out vec4 o;
void main() {

precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec4 aCol;
layout(location = 2) in float aSize;

uniform float uDpr, uCamD, uGain;

  Orbit.prototype.update = function (geo, heads, o) {

    for (let i = 0; i < RING; i++) {
      const t = this.ringT[i], p = Orbit.point(geo, t, this.ringJ[i]);
      const front = Math.sin(t);
      let a = (front > 0 ? 0.05 + 0.07 * front : 0.035) * this.ringA[i] * (Math.abs(this.ringJ[i]) > 2 ? 0.35 : 1) * A;
      if (front < 0 && o.hidden(p[0], p[1], p[2])) a = 0;
      put(p, a, 1.1);

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, P, 0, k * 3);

  };

  Orbit.prototype.draw = function (u) {
    if (!this.count) return;

    gl.uniformMatrix4fv(U.uVP, false, u.vp);

  };

})();

/* SOUND：点击后才启动。用 WebAudio 无缝循环小志的现场录音，分析低音能量得到 beat（0~1），驱动粒子脉动。
   打开播放器时暂停，关掉后恢复。读取失败（例如直接双击 file:// 打开）时退回 <audio> 播放，只是不跟拍。 */
(function () {
  const XZ = window.XZ;

  const A = {
    on: false, busy: false, ctx: null, buf: null, src: null, gain: null, an: null, data: null, el: null,
    level: 0, avg: 0, beat: 0, cool: 0, held: false,

    async toggle() {
      if (this.busy) return this.on;
      this.busy = true;
      try { if (this.on) this.stop(); else await this.start(); } finally { this.busy = false; }
      return this.on;
    },

    async start() {
      const src = XZ.content.sound.src;
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          this.an = this.ctx.createAnalyser(); this.an.fftSize = 1024; this.an.smoothingTimeConstant = 0.5;
          this.gain = this.ctx.createGain(); this.gain.gain.value = 0;
          this.an.connect(this.gain); this.gain.connect(this.ctx.destination);
          this.data = new Uint8Array(this.an.frequencyBinCount);
        }
        if (this.ctx.state === 'suspended') await this.ctx.resume();
        if (!this.buf) {
          const res = await fetch(src);
          if (!res.ok) throw new Error('audio ' + res.status);
          this.buf = await this.ctx.decodeAudioData(await res.arrayBuffer());
        }
        const s = this.ctx.createBufferSource();
        s.buffer = this.buf; s.loop = true; s.connect(this.an); s.start();
        this.src = s;
        const g = this.gain.gain, t = this.ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.55, t + 1.4);
        this.on = true;
      } catch (e) {
        // 退回普通播放（没有节拍联动）
        if (!this.el) { this.el = new Audio(src); this.el.loop = true; this.el.volume = 0.5; }
        try { await this.el.play(); this.on = true; } catch (e2) { this.on = false; }
      }
    },

    stop() {
      this.on = false;
      if (this.src && this.ctx) {
        const g = this.gain.gain, t = this.ctx.currentTime, s = this.src;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.45);
        setTimeout(() => { try { s.stop(); } catch (e) { /* 已停止 */ } }, 500);
        this.src = null;
      }
      if (this.el) this.el.pause();
    },

    // 播放器打开时让路
    hold(yes) {
      if (yes === this.held) return;
      this.held = yes;
      if (!this.on) return;
      if (this.ctx) { if (yes) this.ctx.suspend(); else this.ctx.resume(); }
      if (this.el) { if (yes) this.el.pause(); else this.el.play().catch(() => {}); }
    },

    update(dt) {
      if (!this.on || this.held || !this.src || !this.an) {
        this.beat *= Math.exp(-dt * 6); this.level *= Math.exp(-dt * 6);
        return;
      }
      this.an.getByteFrequencyData(this.data);
      const hz = this.ctx.sampleRate / this.an.fftSize;
      let sum = 0, cnt = 0;
      for (let i = 1; i * hz < 150; i++) { sum += this.data[i]; cnt++; }
      const lv = cnt ? sum / cnt / 255 : 0;
      this.avg += (lv - this.avg) * Math.min(1, dt * 1.2);
      this.cool -= dt;
      if (lv - this.avg > 0.05 && this.cool <= 0) { this.beat = Math.min(1, 0.55 + (lv - this.avg) * 4); this.cool = 0.22; }
      this.beat *= Math.exp(-dt * 7);
      this.level = lv;
    },
  };

  XZ.audio = A;
})();

/* 影院播放器：支持分段视频无缝衔接（两个 video 交替），章节刻度、键盘控制。 */
(function () {

  const T = {

      // 文字版
      $('sr-lives').innerHTML = C.lives.map((w) => `<li>${esc(w.title)} ${esc(w.date)} · ${esc(w.length)}</li>`).join('');
      $('sr-works').innerHTML = `<li>${esc(C.film.title)} · ${esc(C.film.kind)} · ${esc(C.film.length)}</li>`;
      $('sr-contacts').innerHTML = C.contacts.map((c) => `<li>${esc(c.label)}：${c.value ? esc(c.value) : '待补充'}</li>`).join('');
      $('p-contact').querySelector('.fb-big').textContent = C.profile.name;
      this.panels = [...document.querySelectorAll('.panel')];
      this.wallVideo = $('wall-video');
      document.body.dataset.view = 'intro';
    },

    measureEntries() {
      this.entries.forEach((e) => {
        const l = e.el.querySelector('.l'), s = e.el.querySelector('.sub');
        e.w = Math.max(l.offsetWidth, s.offsetWidth) || 150;
      });
    },

    // ============================================================ 事件
    bind() {
      window.addEventListener('resize', () => this.onResize());
      window.addEventListener('pointermove', (e) => this.onMove(e), { passive: true });
      window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') { this.touching = true; this.orbV = 0; this.lastImp = null; this.onMove(e); } }, { passive: true });
      const up = (e) => { if (e.pointerType === 'touch') { this.touching = false; this.ptr[2] = 0; this.lastImp = null; this.hover = -1; this.entries.forEach((x) => x.el.classList.remove('on')); } };
      window.addEventListener('pointerup', up, { passive: true });
      window.addEventListener('pointercancel', up, { passive: true });
      document.documentElement.addEventListener('pointerleave', () => { this.ptr[2] = 0; this.lastImp = null; this.cam.ty = 0; this.cam.tp = 0; });
      window.addEventListener('blur', () => { this.ptr[2] = 0; this.lastImp = null; });

      this.entries.forEach((e) => {
        e.el.addEventListener('click', () => this.go(e.id));
        e.el.addEventListener('pointerenter', () => { this.hover = e.k; e.el.classList.add('on'); });
        e.el.addEventListener('pointerleave', () => { if (this.hover === e.k) this.hover = -1; e.el.classList.remove('on'); });
        e.el.addEventListener('focus', () => { this.hover = e.k; });
        e.el.addEventListener('blur', () => { if (this.hover === e.k) this.hover = -1; });
      });
      this.secBtns.forEach((b) => b.addEventListener('click', () => {
        const r = b.getBoundingClientRect();
        this.go(b.dataset.view, [r.left + r.width / 2 - this.W / 2, r.top - this.H / 2]);
      }));
      $('logo').addEventListener('click', () => this.go('home'));
      $('sound').addEventListener('click', () => this.toggleSound());
      this.skillRows.forEach((row, i) => {
        row.addEventListener('pointerenter', () => this.setHi(i));
        row.addEventListener('pointerleave', () => this.setHi(-1));
        row.addEventListener('focus', () => this.setHi(i));
        row.addEventListener('blur', () => this.setHi(-1));
        row.addEventListener('click', () => this.setHi(this.hi === i && COARSE ? -1 : i));
      });
      this.liveBtns.forEach((b, i) => b.addEventListener('click', () => this.selectLive(i)));
      $('watch-live').addEventListener('click', () => this.openVideo(C.lives[this.live]));
      $('watch-film').addEventListener('click', () => this.openVideo(C.film));
      document.addEventListener('keydown', (e) => {
        if (XZ.theater.open) return;
        if (e.key === 'Escape' && this.view !== 'home' && this.view !== 'intro') { e.preventDefault(); this.go('home'); }
        if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && VIEWS.includes(this.view) && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
          const i = VIEWS.indexOf(this.view), j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length;
          this.go(VIEWS[j], [0, this.H / 2]);
        }
      });
      window.addEventListener('hashchange', () => {
        const h = location.hash.slice(1);
        if (!this.ready) return;
        if (VIEWS.includes(h)) this.go(h); else if (!h) this.go('home');
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.running = false; this.wallVideo.pause(); }
        else if (!XZ.theater.open && !this.running) { this.running = true; this.last = 0; if (WALLS.includes(this.view)) this.playWall(); requestAnimationFrame(this.frameBound); }
      });
      XZ.theater.init();
      XZ.theater.onClose = () => {
        XZ.audio.hold(false);
        if (!this.running) { this.running = true; this.last = 0; requestAnimationFrame(this.frameBound); }
        if (WALLS.includes(this.view)) this.playWall();
      };
    },

    onMove(e) {
      const x = e.clientX, y = e.clientY;
      this.cam.ty = (x / this.W - 0.5) * 2 * 2.4 * DEG;
      this.cam.tp = (y / this.H - 0.5) * 2 * 1.6 * DEG;
      if (REDUCE || (e.pointerType === 'touch' && !this.touching)) return;
      const d = this.dpr, X = x * d, Y = (this.H - y) * d;
      this.ptr[0] = X; this.ptr[1] = Y; this.ptr[2] = 1;
      const l = this.lastImp, now = performance.now();
      if (!l) { this.lastImp = { x, y, t: now }; return; }
      const dx = x - l.x, dy = y - l.y, dist = Math.hypot(dx, dy);
      if (dist < 14 && now - l.t < 45) return;
      let vx = dx * d * 1.3, vy = -dy * d * 1.3;
      const sp = Math.hypot(vx, vy), max = 80 * d;
      if (sp > max) { vx *= max / sp; vy *= max / sp; }
      const i = this.impI = (this.impI + 1) % NI;
      this.imp[i * 4] = X - dx * d * 0.5; this.imp[i * 4 + 1] = Y + dy * d * 0.5;
      this.imp[i * 4 + 2] = vx; this.imp[i * 4 + 3] = vy; this.impK[i] = 1;
      this.lastImp = { x, y, t: now };
    },

    onResize() {
      clearTimeout(this.rt);
      this.rt = setTimeout(() => {
        const pw = this.W, ph = this.H, pland = this.land;
        this.measure();
        if (!this.gl) return;
        this.resizeGL();
        const big = Math.abs(this.W - pw) > 2 || Math.abs(this.H - ph) / ph > 0.15 || pland !== this.land;
        if (big) {
          this.forms = {};
          this.L = this.layout();
          const v = this.view === 'intro' ? 'home' : this.view;
          this.P.morph(this.formation(v), { dur: REDUCE ? 0.3 : 0.9, delay: 0.1, focus: [0, 0], focusR: 2000, turb: REDUCE ? 0 : 40, now: this.clock });
          this.measureEntries();
        } else {
          this.L.view = { W: this.W, H: this.H };
        }
      }, 160);
    },

    // ============================================================ 状态切换
    go(view, from) {
      if (view === this.view || !this.ready) return;
      if (!this.gl) { this.view = view; this.applyView(view, 0); return; }
      const prev = this.view, L = this.L;
      this.view = view;
      const f = this.formation(view);
      let focus, dur, delay, turb;
      if (prev === 'home') {
        const e = this.entries.find((x) => x.id === view);
        focus = e && e.p ? [e.p[0], e.p[1]] : [0, L.H / 2]; dur = 2.1; delay = 0.42; turb = 130;
      } else if (view === 'home') { focus = [L.portrait.cx, L.portrait.cy]; dur = 2.3; delay = 0.5; turb = 110; }
      else { focus = from || [0, L.H / 2]; dur = 1.8; delay = 0.38; turb = 120; }
      if (REDUCE) { dur = 0.7; delay = 0; turb = 0; }
      this.P.morph(f, { dur, delay, focus, focusR: Math.max(L.W, L.H) * 0.9, turb, now: this.clock });
      this.applyView(view, dur);
    },

    applyView(view, dur) {
      const b = document.body;
      b.dataset.view = view;
      b.classList.toggle('in-section', VIEWS.includes(view));
      this.panels.forEach((p) => {
        p.style.setProperty('--in', (dur * 0.52).toFixed(2) + 's');
        p.classList.toggle('is-on', p.dataset.view === view);
      });
      this.secBtns.forEach((x) => x.setAttribute('aria-current', String(x.dataset.view === view)));
      this.setHi(-1);
      if (WALLS.includes(view)) this.playWall(); else this.wallVideo.pause();
      const h = view === 'home' ? '' : '#' + view;
      if (location.hash !== h) { try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) { /* 沙箱里可能不允许 */ } }
      if (view !== 'home') this.entries.forEach((e) => e.el.classList.remove('on'));
    },

    startIntro() {
      const L = this.L, home = this.formation('home');
      this.fadeStart = performance.now() / 1000;
      this.measureEntries();
      document.body.classList.add('gl-on');
      if (REDUCE) {
        this.P.morph(home, { instant: true });
        this.finishIntro(0.3);
        return;
      }
      this.P.morph(S.scatter(this.n, L.view), { instant: true });
      this.P.morph(home, { dur: 3.8, delay: 0.55, focus: [L.portrait.cx, L.portrait.cy], focusR: Math.max(L.W, L.H) * 0.75, turb: 190, now: performance.now() / 1000 + 0.3 });
      this.finishIntro(2.3);
    },

    finishIntro(sec) {
      setTimeout(() => {
        this.view = 'home'; this.ready = true;
        document.body.classList.add('ready');
        this.applyView('home', 0);
        const h = location.hash.slice(1);
        if (VIEWS.includes(h)) setTimeout(() => this.go(h), REDUCE ? 100 : 1400);
      }, sec * 1000);
    },

    fallback() {
      this.gl = false;
      document.body.classList.add('no-gl', 'plain-video', 'ready');
      this.view = 'home'; this.ready = true;
      this.applyView('home', 0);
      const h = location.hash.slice(1);
      if (VIEWS.includes(h)) this.go(h);
    },

    setHi(i) {
      this.hi = i;
      this.skillRows.forEach((r, k) => r.classList.toggle('on', k === i));
    },

    // ============================================================ 作品
    // 光点屏的视频：现场页放当前选中的现场，作品页放影片；同一个 <video> 跟着挪进当前页的框里（降级时直接显示它）
    playWall() {
      const v = this.wallVideo, film = this.view === 'works';
      const src = film ? C.film.loop : C.lives[this.live].loop;
      const box = $(film ? 'film-box' : 'live-box');
      if (v.parentNode !== box) box.appendChild(v);
      if (!v.getAttribute('src') || !v.src.endsWith(src)) v.src = src;
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    },
    selectLive(i) {
      if (i === this.live) return;
      this.live = i;
      this.liveBtns.forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
      this.flash = 1;
      this.playWall();
    },
    // 播放完整版；在线预览版（preview.js）改放精华片段
    openVideo(item) {
      const pv = XZ.PREVIEW && XZ.PREVIEW.play[item.id];
      const title = item === C.film ? `${item.title} · ${item.kind}` : [item.title, item.date].filter(Boolean).join(' · ');
      const opts = pv ? Object.assign({ title: `${title}（${XZ.PREVIEW.note}）` }, pv)
        : { title, src: (C.media.fullBase || '') + item.full, duration: item.duration };
      this.running = false;
      this.wallVideo.pause();
      XZ.audio.hold(true);
      XZ.theater.show(opts);
    },

    // ============================================================ 声音 / 复制
    async toggleSound() {
      const want = !XZ.audio.on;
      const on = await XZ.audio.toggle();
      if (want && !on) this.toast('这个浏览器暂时放不了声音');
      $('sound').setAttribute('aria-pressed', String(on));
      $('sound-label').textContent = on ? 'Sound on' : 'Sound off';
    },
    bars() {
      if (!this.barEls) this.barEls = [...$('sound').querySelectorAll('.bars b')];
      const A = XZ.audio;
      this.barEls.forEach((b, i) => {
        const v = A.on && !A.held ? clamp(A.level * 1.4 + A.beat * (0.5 + 0.5 * Math.sin(this.time * 9 + i * 1.7)), 0, 1) : 0;
        b.style.height = (3 + v * 8).toFixed(1) + 'px';
      });
    },
    copy(c) {
      if (!c.value) return;
      const done = () => this.toast(`已复制${c.label}`);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.value).then(done, () => this.toast(c.value));
      else this.toast(c.value);
    },
    toast(msg) {
      const t = $('toast');
      t.textContent = msg; t.classList.add('is-on');
      clearTimeout(this.tt); this.tt = setTimeout(() => t.classList.remove('is-on'), 1800);
    },

    // ============================================================ 每帧
    project(p) {
      const m = this.vp, x = p[0], y = -p[1], z = p[2];
      const cx = m[0] * x + m[4] * y + m[8] * z + m[12], cy = m[1] * x + m[5] * y + m[9] * z + m[13], cw = m[3] * x + m[7] * y + m[11] * z + m[15];
      return [(cx / cw * 0.5 + 0.5) * this.W, (0.5 - cy / cw * 0.5) * this.H];
    },

    // 轨道上的点是否在人像背后被挡住
    hidden(x, y, z) {
      if (!this.land || z >= 0 || this.view !== 'home') return false;
      const P = this.L.portrait;
      return S.alphaAt(this.data, (x - P.cx) / P.S + S.U0, (y - P.cy) / P.S + S.V0) > 0.35;
    },

    updateEntries() {
      const geo = this.L.orbit;
      this.entries.forEach((e) => {
        const t = e.t0 + this.orbT, p = XZ.Orbit.point(geo, t), s = this.project(p);
        e.p = p;
        const labelWidth = e.w;
        const gap = this.land ? 30 : 36;
        let right = p[0] >= geo.cx;
        if (right && s[0] + gap + labelWidth > this.W - 12) right = false;
        else if (!right && s[0] - gap - labelWidth < 12) right = true;
        if (e.right !== right) { e.right = right; e.el.classList.toggle('right', right); e.el.classList.toggle('left', !right); }
        const behind = Math.sin(t) < 0;
        if (e.behind !== behind) { e.behind = behind; e.el.classList.toggle('behind', behind); }
        e.el.style.transform = `translate3d(${s[0].toFixed(1)}px, ${s[1].toFixed(1)}px, 0)`;
      });
    },

    frame(ms) {
      if (!this.running) return;
      requestAnimationFrame(this.frameBound);
      this.tick(ms / 1000);
    },

    // 验证用：停掉动画循环，按指定时间画一帧
    debugFrame(now) { this.running = false; this.tick(now); },

    tick(now) {
      const dt = this.last ? clamp(now - this.last, 0.001, 0.05) : 1 / 60;
      this.last = now; this.clock = now; this.time += dt;
      XZ.audio.update(dt);
      this.bars();
      if (!this.gl) return;
      this.watchPerf(dt);

      const k = 1 - Math.exp(-dt * 2.2), cam = this.cam;
      cam.yaw += (cam.ty - cam.yaw) * k; cam.pitch += (cam.tp - cam.pitch) * k;
      const fov = 2 * Math.atan(this.H / 2 / cam.d);
      this.vp = mul(persp(fov, this.W / this.H, cam.d * 0.2, cam.d * 4), viewM(cam.yaw, cam.pitch, cam.d));

      const dk = Math.exp(-dt / 0.45);
      for (let i = 0; i < NI; i++) this.impK[i] *= dk;
      const p = this.P.update(now);

      // 轨道与彗星
      const homeOn = this.view === 'home' && this.ready;
      this.orbA += ((homeOn && p > 0.7 ? 1 : 0) - this.orbA) * (1 - Math.exp(-dt * (homeOn ? 1.4 : 6)));
      this.orbV += ((this.hover >= 0 || this.touching || REDUCE ? 0 : 1) - this.orbV) * (1 - Math.exp(-dt * 3));
      this.orbT += dt * ORBIT_W * this.orbV;
      if (this.orbA > 0.004) {
        const heads = this.entries.map((e) => ({ t: e.t0 + this.orbT, on: this.hover === e.k, a: 1 }));
        this.O.update(this.L.orbit, heads, { alpha: this.orbA, hidden: (x, y, z) => this.hidden(x, y, z) });
      } else this.O.count = 0;
      if (homeOn) this.updateEntries();

      if (WALLS.includes(this.view)) {
        this.P.video(this.wallVideo);
        if (this.P.videoBlocked && !document.body.classList.contains('plain-video')) document.body.classList.add('plain-video');
      }
      this.flash *= Math.exp(-dt * 3.2);
      this.fade = clamp((now - (this.fadeStart || now)) / 1.2, 0, 1);

      // 背后那层暖光跟着主体走
      const L = this.L, d = this.dpr;
      let gx = 0, gy = 0, ga = 0.035;
      if (this.view === 'home' || this.view === 'intro') { gx = L.portrait.cx + 0.01 * L.portrait.S; gy = L.portrait.cy + 0.04 * L.portrait.S; ga = 0.05; }
      else if (WALLS.includes(this.view)) { const b = this.wallBox(); gx = b.x; gy = b.y; ga = 0.03; }
      const gk = 1 - Math.exp(-dt * 1.5);
      this.glow[0] += (gx - this.glow[0]) * gk; this.glow[1] += (gy - this.glow[1]) * gk; this.glow[2] += (ga - this.glow[2]) * gk;

      const G = this.G;
      G.begin();
      const center = this.view === 'home' || this.view === 'intro' ? [L.portrait.cx, L.portrait.cy] : [0, 0];
      const u = {
        vp: this.vp, res: [G.w, G.h], center, dpr: d, camD: cam.d, time: this.time,
        beat: XZ.audio.beat * (REDUCE ? 0.3 : 1), gain: G.hdr ? 1 : 0.32, hi: this.hi, flash: this.flash,
        drift: REDUCE ? 0 : 1, driftScale: L.portrait.S / 1080,
        imp: this.imp, impK: this.windK(), impR2: 2 * Math.pow(95 * d, 2), ptrPush: REDUCE || this.view !== 'home' ? 0 : 30 * d, ptrR2: 2 * Math.pow(78 * d, 2), offMax: 130 * d,
        ptr: this.ptr,
      };
      this.P.draw(u);
      this.O.draw(u);
      const ex = G.hdr ? 1.2 : 3.4;
      G.end({
        exposure: ex, threshold: 0.38 / ex, k1: 0.42, k2: 0.34, k3: 0.3, time: this.time, fade: this.fade,
        bg: [0.018, 0.016, 0.02], glow: this.glow[2], glowCol: [1, 0.72, 0.5],
        glowPos: [(this.glow[0] + L.W / 2) * d, (L.H / 2 - this.glow[1]) * d], glowR: [0.29 * L.W * d, 0.39 * L.H * d],
      });
    },

    // 首页风最大；内页里文字要能读，风小一些
    windK() {
      const k = this.view === 'home' || this.view === 'intro' ? 1 : 0.55;
      if (!this.impKs) this.impKs = new Float32Array(NI);
      for (let i = 0; i < NI; i++) this.impKs[i] = this.impK[i] * k;
      return this.impKs;
    },

    // 前几秒帧率太低就降一次分辨率
    watchPerf(dt) {
      const pf = this.perf;
      if (pf.done || !this.ready) return;
      pf.t += dt; pf.n++;
      if (pf.t > 2.5) {
        pf.done = true;
        const fps = pf.n / pf.t;
        if (fps < 34 && this.dpr > 1) { this.dprScale = 0.72; this.measure(); this.resizeGL(); }
      }
    },
  };

  XZ.app = app;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => app.init());
  else app.init();
})();

</script>
</body>
</html>
